[project]
name = "lesson-content-generator"
version = "1.5.0"
description = "Self-Evaluating Lesson Content Generator — Phase-1.5 (plan_topic+generate+compliant loop+domain hint)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "rake-nltk>=1.0.6",
    "yake>=0.4.8",
    "wikipedia>=1.4.0",
    "textstat>=0.7.3",
    "wordfreq>=3.0",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langfuse>=2.40",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
